<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Project Bornomala logo: the Bengali letter Ba">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F3EFFF"/>
    </linearGradient>
    <linearGradient id="matra" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F4A400"/>
      <stop offset="1" stop-color="#E4572E"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3A2E8C"/>
      <stop offset="1" stop-color="#5B45C7"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#3A2E8C" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- rounded tile -->
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#tile)" stroke="#E4DEFA" stroke-width="2" filter="url(#soft)"/>

  <!-- matra: the horizontal headline that defines Bengali script -->
  <rect x="66" y="70" width="124" height="12" rx="6" fill="url(#matra)"/>

  <!-- the Bengali letter Ba, first letter of Bornomala -->
  <text x="128" y="176" font-family="'Noto Serif Bengali','Kalpurush','Vrinda',serif" font-size="150" fill="url(#ink)" text-anchor="middle">ব</text>

  <!-- five dialect marks: the West Bengal dialect groups Bornomala documents -->
  <g>
    <circle cx="86"  cy="212" r="7" fill="#3A2E8C"/>
    <circle cx="107" cy="212" r="7" fill="#00A9A5"/>
    <circle cx="128" cy="212" r="7" fill="#F4A400"/>
    <circle cx="149" cy="212" r="7" fill="#E4572E"/>
    <circle cx="170" cy="212" r="7" fill="#5B45C7"/>
  </g>
</svg>
