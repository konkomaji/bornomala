name: CI

on:
  push:
    branches: [main]
    paths: ["bengali-tokenizer/**", ".github/workflows/ci.yml"]
  pull_request:
    paths: ["bengali-tokenizer/**", ".github/workflows/ci.yml"]

jobs:
  bengali-tokenizer:
    name: Bengali tokenizer (py${{ matrix.python }})
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bengali-tokenizer
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        run: ruff check bntok scripts tests
      - name: Test
        # Trains tiny tokenizers in-process: no downloads, fully deterministic.
        run: pytest -q
