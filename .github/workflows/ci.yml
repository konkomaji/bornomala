name: CI

on:
  push:
    branches: [main]
    paths: ["mothertongueindex/**", ".github/workflows/ci.yml"]
  pull_request:
    paths: ["mothertongueindex/**", ".github/workflows/ci.yml"]

jobs:
  test:
    name: test (py${{ matrix.python }})
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mothertongueindex
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          # tiktoken gives us an exact, no-auth tokenizer for CI.
          pip install tiktoken

      - name: Lint
        run: ruff check .

      - name: Test
        # Only OpenAI (tiktoken) backends are exercised in CI: no HF downloads,
        # no gated models, fully offline-friendly and deterministic.
        run: pytest -q
