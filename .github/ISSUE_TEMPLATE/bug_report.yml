name: "🐛 Bug report"
description: Report something that is broken or wrong
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Thanks for the report. Please be specific so we can reproduce it."
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: "0.1.0 or a commit SHA"
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What did you run, and what went wrong?
      placeholder: "python -m mti --models ... \"text\"  ->  ..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment
      placeholder: "OS, Python version"
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I confirmed this is not a gated-model auth issue (HF_TOKEN not set).
        - label: I included the exact command and text (or a minimal sample).
