<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320" role="img" aria-label="MotherTongueIndex: how efficient is your language on today's AI, versus English">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FBFBFF"/>
      <stop offset="1" stop-color="#EEF0FF"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00A9A5"/>
      <stop offset="0.5" stop-color="#4A46E0"/>
      <stop offset="1" stop-color="#FF6F5B"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4A46E0"/>
      <stop offset="1" stop-color="#7A2BE2"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="320" fill="url(#bg)"/>

  <!-- logo tile: a ring of world scripts around an index dial (matches logo.svg) -->
  <g>
    <rect x="70" y="60" width="200" height="200" rx="46" fill="#FFFFFF" stroke="#E2E5FF" stroke-width="2"/>
    <circle cx="170" cy="160" r="72" fill="none" stroke="url(#ring)" stroke-width="3" stroke-dasharray="2 9" stroke-linecap="round" opacity="0.85"/>
    <g font-size="26" text-anchor="middle" dominant-baseline="central">
      <text x="170" y="88"  font-family="'Segoe UI',sans-serif" font-weight="800" fill="#4A46E0">A</text>
      <text x="212" y="102" font-family="'Noto Serif Bengali',serif" fill="#00A9A5">অ</text>
      <text x="238" y="138" font-family="'Noto Sans Devanagari',serif" fill="#FF6F5B">अ</text>
      <text x="238" y="182" font-family="'Noto Sans CJK SC',sans-serif" fill="#7A2BE2">中</text>
      <text x="212" y="218" font-family="'Noto Sans CJK JP',sans-serif" fill="#F5A623">あ</text>
      <text x="170" y="232" font-family="'Noto Sans CJK KR',sans-serif" fill="#E0468A">한</text>
      <text x="128" y="218" font-family="'Noto Naskh Arabic',serif" fill="#4A46E0">ع</text>
      <text x="102" y="182" font-family="serif" fill="#00A9A5">Ω</text>
      <text x="102" y="138" font-family="sans-serif" fill="#FF6F5B">Я</text>
      <text x="128" y="102" font-family="'Noto Sans Tamil',serif" fill="#7A2BE2">க</text>
    </g>
    <circle cx="170" cy="160" r="30" fill="#FFFFFF" stroke="#E2E5FF" stroke-width="2"/>
    <path d="M149 170 A 22 22 0 0 1 191 170" fill="none" stroke="#E5E7F5" stroke-width="6" stroke-linecap="round"/>
    <path d="M149 170 A 22 22 0 0 1 171 142" fill="none" stroke="url(#ring)" stroke-width="6" stroke-linecap="round"/>
    <line x1="170" y1="170" x2="186" y2="151" stroke="#FF6F5B" stroke-width="4" stroke-linecap="round"/>
    <circle cx="170" cy="170" r="5" fill="#4A46E0"/><circle cx="170" cy="170" r="2" fill="#fff"/>
  </g>

  <!-- wordmark -->
  <g transform="translate(320,0)">
    <text x="0" y="150" font-family="'Segoe UI',system-ui,sans-serif" font-weight="800" font-size="70" fill="url(#ink)">MotherTongueIndex</text>
    <text x="2" y="194" font-family="'Segoe UI',system-ui,sans-serif" font-size="29" fill="#3A3D66">How efficient is your language on today's AI, versus English?</text>
    <g font-family="'Segoe UI',system-ui,sans-serif" font-size="20" fill="#5B5E86">
      <rect x="0" y="220" width="200" height="38" rx="19" fill="#FFFFFF" stroke="#D9DCFF"/>
      <text x="20" y="245">28 model tokenizers</text>
      <rect x="216" y="220" width="150" height="38" rx="19" fill="#FFFFFF" stroke="#D9DCFF"/>
      <text x="236" y="245">any language</text>
      <rect x="382" y="220" width="250" height="38" rx="19" fill="#FFFFFF" stroke="#D9DCFF"/>
      <text x="402" y="245">a Project Bornomala tool</text>
    </g>
  </g>
</svg>
