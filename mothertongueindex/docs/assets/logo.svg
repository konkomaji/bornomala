<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="MotherTongueIndex logo: a ring of world scripts around an index dial">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#EEF0FF"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00A9A5"/>
      <stop offset="0.5" stop-color="#4A46E0"/>
      <stop offset="1" stop-color="#FF6F5B"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#4A46E0" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- rounded tile -->
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#tile)" stroke="#E2E5FF" stroke-width="2" filter="url(#soft)"/>

  <!-- unifying ring the scripts sit on -->
  <circle cx="128" cy="128" r="80" fill="none" stroke="url(#ring)" stroke-width="3" stroke-dasharray="2 9" stroke-linecap="round" opacity="0.85"/>

  <!-- a ring of world scripts: one index for every mother tongue -->
  <g font-size="30" text-anchor="middle" dominant-baseline="central">
    <text x="128" y="48"  font-family="'Segoe UI',sans-serif" font-weight="800" fill="#4A46E0">A</text>
    <text x="168" y="59"  font-family="'Noto Serif Bengali',serif" fill="#00A9A5">অ</text>
    <text x="197" y="88"  font-family="'Noto Sans Devanagari',serif" fill="#FF6F5B">अ</text>
    <text x="208" y="128" font-family="'Noto Sans CJK SC',sans-serif" fill="#7A2BE2">中</text>
    <text x="197" y="168" font-family="'Noto Sans CJK JP',sans-serif" fill="#F5A623">あ</text>
    <text x="168" y="197" font-family="'Noto Sans CJK KR',sans-serif" fill="#E0468A">한</text>
    <text x="128" y="208" font-family="'Noto Naskh Arabic',serif" fill="#4A46E0">ع</text>
    <text x="88"  y="197" font-family="serif" fill="#00A9A5">Ω</text>
    <text x="59"  y="168" font-family="sans-serif" fill="#FF6F5B">Я</text>
    <text x="48"  y="128" font-family="'Noto Sans Tamil',serif" fill="#7A2BE2">அ</text>
    <text x="59"  y="88"  font-family="'Noto Sans Hebrew',serif" fill="#F5A623">א</text>
    <text x="88"  y="59"  font-family="'Noto Sans Thai',sans-serif" fill="#E0468A">ก</text>
  </g>

  <!-- central index dial: the "measure" at the heart of the languages -->
  <circle cx="128" cy="128" r="34" fill="#FFFFFF" stroke="#E2E5FF" stroke-width="2"/>
  <path d="M104 140 A 26 26 0 0 1 152 140" fill="none" stroke="#E5E7F5" stroke-width="7" stroke-linecap="round"/>
  <path d="M104 140 A 26 26 0 0 1 130 108" fill="none" stroke="url(#ring)" stroke-width="7" stroke-linecap="round"/>
  <line x1="128" y1="140" x2="146" y2="118" stroke="#FF6F5B" stroke-width="4" stroke-linecap="round"/>
  <circle cx="128" cy="140" r="6" fill="#4A46E0"/><circle cx="128" cy="140" r="2.5" fill="#fff"/>
</svg>
